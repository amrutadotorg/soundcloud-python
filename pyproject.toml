[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soundcloud"
description = "A friendly wrapper library for the Soundcloud API"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [
    { name = "SoundCloud", email = "api@soundcloud.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.0.0",
]

dynamic = ["version"]

[project.urls]
Repository = "https://github.com/amrutadotorg/soundcloud-python"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff",
    "pyright",
    "types-requests",
]

[tool.hatch.version]
path = "soundcloud/__init__.py"

[tool.pytest.ini_options]
testpaths = ["soundcloud/tests"]
markers = [
    "integration: tests that hit the live SoundCloud API (opt-in via SOUNDCLOUD_* env vars)",
]

[tool.ruff]
target-version = "py311"

[tool.pyright]
pythonVersion = "3.11"
